name: Pull request build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_zwsvoePoiBeskRuyl2Iar883
  VERCEL_PROJECT_ID: prj_nLX0pIdNKqtYZAK45fyHezal2q3S

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate project
        shell: bash
        run: |
          if npm run | grep -q '^  build'; then
            npm run build
          else
            find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -r -n1 node --check
          fi

  preview:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Require Vercel token
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Repository secret VERCEL_TOKEN is missing. Preview deploy cannot run."
            exit 1
          fi

      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Pull Vercel preview environment
        run: npx --yes vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Vercel preview artifact
        run: npx --yes vercel@latest build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        shell: bash
        run: |
          URL=$(npx --yes vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Vercel Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "PREVIEW_URL=$URL"
