name: Sync production HTML

on:
  push:
    paths:
      - .github/workflows/sync-production.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current production page
        run: curl --fail --silent --show-error --location https://vido-social-frontend.vercel.app/ --output index.html
      - name: Commit synchronized HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat(ui): sync premium landing page [skip ci]"
            git push
          fi
