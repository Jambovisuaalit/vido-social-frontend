<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sivua ei löytynyt — VIDO Social</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050914" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #fff;
        background:
          radial-gradient(
            circle at 20% 10%,
            rgba(255, 0, 0, 0.12),
            transparent 28rem
          ),
          linear-gradient(145deg, #030610, #0b1420);
        font:
          17px/1.55 Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Arial,
          sans-serif;
      }
      .card {
        max-width: 680px;
        padding: clamp(28px, 6vw, 64px);
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        background: rgba(11, 20, 32, 0.9);
        box-shadow: 0 35px 100px rgba(0, 0, 0, 0.34);
      }
      .brand {
        width: 170px;
        margin: auto;
      }
      .brand img {
        display: block;
        width: 100%;
        height: auto;
      }
      .code {
        margin: 35px 0 0;
        color: #ff0000;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.18em;
      }
      .card h1 {
        margin: 10px 0;
        font-size: clamp(44px, 9vw, 78px);
        line-height: 1;
        letter-spacing: -0.06em;
      }
      .card p {
        color: #a7b0c0;
      }
      .btn {
        display: inline-flex;
        margin-top: 24px;
        padding: 14px 22px;
        border-radius: 8px;
        color: #fff;
        background: #ff0000;
        text-decoration: none;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <img
          src="/brand/vido-social-inverted-horizontal.svg"
          alt="VIDO Social"
          width="2000"
          height="560"
        />
      </div>
      <p class="code">404</p>
      <h1>Sivua ei löytynyt.</h1>
      <p>Osoite on voinut muuttua tai sivu on poistettu.</p>
      <a class="btn" href="/">Palaa etusivulle →</a>
    </main>
  </body>
</html>
